[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "titanic-kaimei-example"
version = "1.0.0"
description = "Explain, monitor and improve a Titanic survival model with Kaimei: a complete worked example."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Kaimei AI" }]
dependencies = [
  "kaimei[models]>=0.6.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# XGBoost: notebook 00 (the original Kaggle comparison) and notebook 04 (bring your own model).
xgboost = ["xgboost>=2.0"]
# The scoring service for Kaimei's remote inference (notebook 04, python -m titanic_kaimei.serving).
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
notebooks = [
  "titanic-kaimei-example[xgboost,serve]",
  "jupyterlab>=4.0",
  "seaborn>=0.13",
]
# Tests, lint and re-running the notebooks headless (add [notebooks] for JupyterLab).
dev = [
  "titanic-kaimei-example[xgboost,serve]",
  "seaborn>=0.13",
  "pytest>=7",
  "httpx>=0.25",
  "nbclient>=0.9",
  "nbformat>=5.9",
  "ipykernel>=6.25",
  "ruff>=0.6",
]

[project.urls]
Kaimei = "https://kaimei.ai"
Dashboard = "https://dashboard.kaimei.ai"
"Python client" = "https://github.com/KaimeiAI/kaimei-python-client"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic_kaimei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
