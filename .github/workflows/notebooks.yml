name: Notebooks

# Re-runs every notebook against Kaimei and uploads the executed copies. Needs a repository
# secret KAIMEI_API_KEY (an account with room for 5 models). Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    if: github.repository == 'KaimeiAI/titanic-kaimei-example'
    env:
      KAIMEI_API_KEY: ${{ secrets.KAIMEI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Run the notebooks
        run: python scripts/run_notebooks.py --all
      - name: Check them
        if: always()
        run: pytest tests/test_notebooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebooks
          path: notebooks/*.ipynb
